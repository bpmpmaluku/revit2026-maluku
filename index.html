<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Revit PDM 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #app {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: Arial, sans-serif;
        }

        .loading-box {
            text-align: center;
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 15px;
            border: 4px solid #e5e7eb;
            border-top-color: #003366;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #003366;
            font-size: 15px;
            font-weight: 600;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div id="loading">
        <div class="loading-box">
            <div class="spinner"></div>
            <div class="loading-text">
                Memuat Dashboard Revit PDM 2026...
            </div>
        </div>
    </div>

    <!-- Dashboard Google Apps Script -->
    <div id="app">
        <iframe
            id="gasApp"
            src="https://script.google.com/macros/s/AKfycbxd-RrHIFXIT8PYdGwtkE5tIJYXsE69OXpWZ2lLOZ-jm_vAIL29-0jl6n_mAuaubrEz/exec"
            title="Dashboard Revit PDM 2026"
            allow="fullscreen">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById("gasApp");
        const loading = document.getElementById("loading");

        iframe.addEventListener("load", function () {
            setTimeout(function () {
                loading.style.display = "none";
            }, 500);
        });
    </script>

</body>
</html>
